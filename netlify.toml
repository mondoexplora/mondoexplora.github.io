[build]
  command = "npm run build"
  publish = "out"

# Language redirects
[[redirects]]
  from = "/"
  to = "/en"
  status = 302

# Static files and existing pages
[[redirects]]
  from = "/en/*"
  to = "/en/:splat"
  status = 200

# Catch-all for other paths
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404 